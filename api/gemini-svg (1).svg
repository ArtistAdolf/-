<svg id="kaiser-game-hud" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" style="max-width:920px; background:#080A0E; border-radius:8px; font-family:&#39;Malgun Gothic&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;">
